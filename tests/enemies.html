<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZoneRPG · проверка противников</title><style>body{background:#131b16;color:#ddd9b1;font:16px system-ui;margin:24px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}figure{margin:0;border:1px solid #4a5342;padding:12px}img{width:100%;height:180px;object-fit:contain;image-rendering:pixelated}small{display:block}</style><h1>Противники: данные → локальное изображение</h1><main id="gallery"></main><script src="../items.js"></script><script src="../world.js"></script><script src="../content-v7.js"></script><script src="../art.js"></script><script>document.getElementById('gallery').innerHTML=Object.entries(ZoneRPGWorld.enemyTypes).map(([id,e])=>'<figure><img src="../'+ZoneRPGArt.enemy(e.visual||id)+'" alt="'+e.name+'"><figcaption>'+e.name+'<small>HP '+e.hp+' · урон '+e.damage+'</small></figcaption></figure>').join('');</script></html>
