<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>ZoneRPG — Art pack QA</title><style>body{margin:24px;background:#0e130f;color:#cbd4b9;font:14px monospace}h1{font-size:24px}h2{margin-top:32px;color:#aebb8c}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}figure{margin:0;min-width:0;background:#172019;border:1px solid #394936;padding:8px}img{display:block;width:100%;aspect-ratio:1;object-fit:contain;image-rendering:pixelated}figure[data-kind="locations"] img,figure[data-kind="events"] img{aspect-ratio:3/2}figure[data-kind="items"] img{max-height:80px}figcaption{font-size:11px;margin-top:8px;overflow-wrap:anywhere}#status{color:#aeba85}</style></head><body><h1>ZoneRPG · Field art pack</h1><p>Локальная QA-галерея. Оригинальные изображения и fallback; не часть игрового UI.</p><p id="status">Проверка изображений…</p><main id="gallery"></main><script src="art.js"></script><script>const groups={},assets=window.ZoneRPGArt.allPaths;let loaded=0,broken=0;for(const src of assets){const kind=src.split('/')[2];(groups[kind]||=[]).push(src);}for(const [kind,files]of Object.entries(groups)){const title=document.createElement('h2');title.textContent=kind+' · '+files.length;gallery.append(title);const section=document.createElement('section');for(const src of files){const card=document.createElement('figure');card.dataset.kind=kind;const img=new Image();img.alt=src.split('/').pop();img.onload=()=>{loaded++;statusText();};img.onerror=()=>{broken++;statusText();};img.src=src;const caption=document.createElement('figcaption');caption.textContent=img.alt;card.append(img,caption);section.append(card);}gallery.append(section);}function statusText(){document.getElementById('status').textContent='Loaded '+loaded+' / '+assets.length+' · broken '+broken;}</script></body></html>
